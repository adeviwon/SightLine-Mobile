<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SightLine">
<meta name="theme-color" content="#0a0a0a">
<title>SightLine — Offline Document Reader</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: #0a0a0a; color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh; min-height: 100dvh;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  display: flex; flex-direction: column; align-items: center;
}
header { width: 100%; padding: 16px; text-align: center; background: #111; border-bottom: 1px solid #2a2a2a; }
header h1 { font-size: 22px; letter-spacing: 0.5px; }
header h1 span { color: #00a8ff; }
header p { font-size: 12px; color: #888; margin-top: 2px; }
#badge {
  display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 20px;
  background: #00c896; color: #000; font-size: 11px; font-weight: 700;
}
#badge.pending { background: #ffb020; }
#stage { width: 100%; max-width: 560px; padding: 12px 16px; flex: 1; }
.tabs { display: flex; border: 1px solid #333; border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
.tab { flex: 1; padding: 12px; text-align: center; background: #141414; color: #888; cursor: pointer; font-size: 14px; font-weight: 600; }
.tab.active { background: #0057b8; color: #fff; }
#viewfinder { position: relative; width: 100%; border-radius: 12px; overflow: hidden; background: #000; }
#video { width: 100%; display: block; }
#preview { width: 100%; display: none; border-radius: 12px; }
#scan-flash { position: absolute; inset: 0; background: rgba(0,200,150,0.35); opacity: 0; pointer-events: none; transition: opacity 0.15s; }
#scan-flash.on { opacity: 1; }
#scan-line { position: absolute; left: 0; right: 0; height: 2px; background: #00c896; box-shadow: 0 0 12px #00c896; display: none; }
#scan-line.on { display: block; animation: sweep 1.2s ease-in-out infinite; }
@keyframes sweep { 0%,100% { top: 8%; } 50% { top: 88%; } }
#quality-hint {
  position: absolute; bottom: 8px; left: 8px; right: 8px; padding: 8px 10px;
  background: rgba(0,0,0,0.72); border-radius: 8px; font-size: 12px; color: #ffd60a; display: none;
}
.controls { display: flex; gap: 10px; margin: 14px 0; }
button {
  background: #0057b8; color: #fff; border: none; padding: 16px 22px;
  border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; flex: 1;
  transition: transform 0.1s, opacity 0.2s;
}
button:active { transform: scale(0.97); }
button:disabled { opacity: 0.35; }
button.secondary { background: #2a2a2a; }
#file-input { display: none; }
#progress-wrap { display: none; margin: 10px 0; }
#progress-label { font-size: 12px; color: #888; margin-bottom: 6px; }
.progress-track { background: #222; height: 8px; border-radius: 4px; overflow: hidden; }
#progress-fill { height: 100%; width: 0%; background: #00a8ff; border-radius: 4px; transition: width 0.2s; }
#results { display: none; margin-top: 12px; }
.card { background: #141414; border: 1px solid #2a2a2a; border-radius: 12px; padding: 14px; margin-bottom: 10px; }
.card h3 { font-size: 13px; color: #00a8ff; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
.summary { font-size: 17px; line-height: 1.45; }
.meta { font-size: 11px; color: #777; margin-top: 10px; }
.field-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid #232323; }
.field-row:last-child { border-bottom: none; }
.field-row .label { color: #999; font-size: 13px; white-space: nowrap; }
.field-row .val { font-size: 14px; text-align: right; word-break: break-word; }
.tag { display: inline-block; margin: 3px; padding: 4px 10px; border-radius: 14px; font-size: 12px; background: #1d2d3d; color: #7cc4ff; border: 1px solid #2d4a66; }
#warning-box { background: #3a2a00; border: 1px solid #8a5a00; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; color: #ffd60a; display: none; }
audio { width: 100%; margin-top: 4px; height: 40px; }
#ocr-text { font-size: 13px; color: #bbb; max-height: 160px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; line-height: 1.4; }
footer { padding: 14px 16px 20px; font-size: 11px; color: #666; text-align: center; }
#error-banner {
  display: none; width: 100%; max-width: 560px; margin: 10px 16px 0; padding: 12px 14px;
  background: #3d0f0f; border: 1px solid #7a2020; border-radius: 10px; color: #ff8a8a; font-size: 13px;
}
</style>
</head>
<body>
<header>
  <h1>Sight<span>Line</span></h1>
  <p>Your eyes, offline. Nothing leaves this device.</p>
  <span id="badge" class="pending">ENGINE: LOADING…</span>
</header>
<div id="error-banner"></div>
<div id="stage">
  <div class="tabs">
    <div class="tab active" id="tab-cam">Camera</div>
    <div class="tab" id="tab-file">Files / 4K</div>
  </div>
  <div id="viewfinder">
    <video id="video" autoplay playsinline muted></video>
    <img id="preview" alt="Captured document">
    <div id="scan-flash"></div>
    <div id="scan-line"></div>
    <div id="quality-hint"></div>
  </div>
  <div class="controls">
    <button id="btn-capture">Scan Document</button>
    <button id="btn-retake" class="secondary" style="display:none">Retake</button>
    <button id="btn-speak" class="secondary" style="display:none">Read Aloud</button>
  </div>
  <input type="file" id="file-input" accept="image/*,application/pdf">
  <div id="progress-wrap">
    <div id="progress-label">Starting…</div>
    <div class="progress-track"><div id="progress-fill"></div></div>
  </div>
  <div id="warning-box"></div>
  <div id="results">
    <div class="card">
      <h3 id="doc-type">Document</h3>
      <div class="summary" id="summary-text"></div>
      <div class="meta" id="result-meta"></div>
    </div>
    <div class="card" id="fields-card" style="display:none">
      <h3>Key Details</h3>
      <div id="fields-list"></div>
    </div>
    <div class="card" id="entities-card" style="display:none">
      <h3>Detected Entities</h3>
      <div id="entities-list"></div>
    </div>
    <div class="card">
      <h3>Audio</h3>
      <audio id="audio-player" controls></audio>
    </div>
    <div class="card">
      <h3>Recognized Text</h3>
      <div id="ocr-text"></div>
    </div>
  </div>
</div>
<footer>SightLine Mobile · 100% on-device OCR · zero network calls after load</footer>

<script src="vendor/tesseract/tesseract.min.js"></script>
<script src="vendor/pdfjs/pdf.min.js"></script>
<script src="js/pipeline.js"></script>
<script src="js/tts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
